<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{name}}</title>
    <style>
      :root { --background: #ffffff; --foreground: #171717; --muted: #737373; --border: #e5e5e5; }
      @media (prefers-color-scheme: dark) {
        :root { --background: #0a0a0a; --foreground: #ededed; --muted: #a3a3a3; --border: #262626; }
      }
      body {
        margin: 0 auto; max-width: 42rem; padding: 3rem 1.5rem;
        background: var(--background); color: var(--foreground);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
      p.muted { color: var(--muted); margin: 0 0 1.5rem; }
      form { display: flex; flex-direction: column; gap: 0.75rem; }
      textarea {
        padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem;
        background: transparent; color: inherit; font: inherit; resize: vertical;
      }
      button {
        align-self: flex-start; padding: 0.5rem 1rem; border: 1px solid var(--border);
        border-radius: 0.5rem; background: var(--foreground); color: var(--background);
        font: inherit; cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      pre { white-space: pre-wrap; margin-top: 1.5rem; min-height: 6rem; }
    </style>
  </head>
  <body>
    <h1 id="name"></h1>
    <p class="muted" id="description"></p>
    <form id="ask">
      <textarea id="prompt" rows="4" placeholder="Ask the local model something"></textarea>
      <button type="submit" id="send">Ask</button>
    </form>
    <pre id="answer"></pre>

    <script>
      // Written by `aias apps init` from the manifest.
      document.getElementById("name").textContent = "{{name}}";
      document.getElementById("description").textContent = "{{description}}";

      const form = document.getElementById("ask");
      const send = document.getElementById("send");
      const answer = document.getElementById("answer");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const prompt = document.getElementById("prompt").value.trim();
        if (!prompt || send.disabled) return;

        send.disabled = true;
        send.textContent = "Answering";
        answer.textContent = "";
        try {
          // The key stays on the server: this request goes to the app, and the
          // app is the only thing that talks to the model.
          const response = await fetch("/api/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt }),
          });
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            answer.textContent += decoder.decode(value, { stream: true });
          }
        } catch (error) {
          answer.textContent = String(error);
        } finally {
          send.disabled = false;
          send.textContent = "Ask";
        }
      });
    </script>
  </body>
</html>
