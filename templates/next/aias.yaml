# AI App Store manifest. The platform injects PORT, HOST, HOSTNAME,
# AIAS_MODEL_CHAT_URL, AIAS_MODEL_CHAT_ID, AIAS_MODEL_CHAT_KEY and
# DATABASE_URL. Nothing else reaches this app.

name: {{name}}
description: "{{description}}"
version: 0.1.0
license: MIT
tags: [example]

runtime: node
# One command on purpose: build is an argv array, so it cannot use a shell
# `&&`. The aias:build script does install, next build, and the copy of
# .next/static and public into the standalone tree.
build: ["bun", "run", "aias:build"]
start: ["node", ".next/standalone/server.js"]
health: /api/health

models:
  - alias: chat
    kind: llm
    repo: Qwen/Qwen3-4B-GGUF
    # Ordered preference, the platform picks the first that fits the device.
    quant: [Q4_K_M, Q8_0]
    # Used when nothing above fits the memory budget.
    fallback: Qwen/Qwen3-0.6B-GGUF

services:
  postgres:
    migrations: db/migrations

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Node and Next.js read the address off HOSTNAME. The platform sets it too,
  # this is what makes `bun run start` by hand behave the same way.
  HOSTNAME: "127.0.0.1"
