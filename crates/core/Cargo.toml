[package]
name = "aias-core"
description = "Core logic of the AI App Store: hardware, runtime, models, services, instances and apps."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
include_dir = "0.7"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["charset", "default-tls", "http2", "json", "query"] }
rmcp = { version = "3", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = "0.10"
sha2 = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "signal", "sync", "time"] }
tokio-postgres = "0.7"
zip = { version = "8", default-features = false, features = ["deflate"] }

[[bin]]
name = "aias"
path = "src/bin/aias.rs"
